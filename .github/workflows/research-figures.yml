name: Final Research Figure Generation

"on":
  push:
    branches:
      - research-revision/reproducible-mutual-information

permissions:
  contents: write

jobs:
  figures:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip install matplotlib

      - name: Generate final research figures
        run: |
          python - <<'PY'
          from pathlib import Path

          import matplotlib.pyplot as plt
          import numpy as np
          import pandas as pd
          from sklearn.metrics import ConfusionMatrixDisplay, RocCurveDisplay, roc_auc_score, roc_curve

          from ml_system.benchmark import MODEL_CONFIGURATIONS
          from ml_system.config.loader import load_settings
          from ml_system.data import load_dataset, split_dataset
          from ml_system.models import build_model
          from ml_system.training import build_training_pipeline, train_model

          settings = load_settings("config/config.yaml")
          dataframe = load_dataset(settings.data.path)
          X_train, X_test, y_train, y_test = split_dataset(
              dataframe=dataframe,
              target_column=settings.data.target_column,
              settings=settings.split,
          )

          training_data = X_train.copy()
          training_data[settings.data.target_column] = y_train

          predictions = {}
          probabilities = {}

          for model_settings in MODEL_CONFIGURATIONS:
              model = build_model(model_settings)
              pipeline = build_training_pipeline(
                  dataframe=training_data,
                  target_column=settings.data.target_column,
                  preprocessing_settings=settings.preprocessing,
                  feature_selection_settings=settings.features.selection,
                  model=model,
              )
              trained = train_model(
                  pipeline=pipeline,
                  training_data=training_data,
                  target_column=settings.data.target_column,
              )
              predictions[model_settings.name] = trained.predict(X_test)
              probabilities[model_settings.name] = trained.predict_proba(X_test)[:, 1]

          output = Path("reports/figures")
          output.mkdir(parents=True, exist_ok=True)

          benchmark = pd.read_csv("reports/metrics/model_benchmark.csv")
          labels = ["Logistic Regression", "Decision Tree", "Random Forest", "Gradient Boosting"]
          keys = ["logistic_regression", "decision_tree", "random_forest", "gradient_boosting"]

          x = np.arange(len(labels))
          width = 0.36

          fig, ax = plt.subplots(figsize=(10, 6))
          ax.bar(x - width / 2, [benchmark.loc[benchmark.model == k, "accuracy"].iloc[0] * 100 for k in keys], width, label="Accuracy")
          ax.bar(x + width / 2, [benchmark.loc[benchmark.model == k, "roc_auc"].iloc[0] * 100 for k in keys], width, label="ROC AUC")
          ax.set_ylabel("Score (%)")
          ax.set_xticks(x)
          ax.set_xticklabels(labels, rotation=20, ha="right")
          ax.set_ylim(0, 100)
          ax.set_title("Holdout Accuracy and ROC AUC by Model")
          ax.legend()
          fig.tight_layout()
          fig.savefig(output / "research_final_holdout_metrics.png", dpi=300)
          plt.close(fig)

          fig, ax = plt.subplots(figsize=(7, 6))
          ConfusionMatrixDisplay(
              confusion_matrix=np.array([[913, 120], [181, 193]]),
              display_labels=["No Churn", "Churn"],
          ).plot(ax=ax, colorbar=False)
          ax.set_title("Gradient Boosting Confusion Matrix on the Holdout Test Set")
          fig.tight_layout()
          fig.savefig(output / "research_final_confusion_matrix.png", dpi=300)
          plt.close(fig)

          cv = pd.read_csv("reports/metrics/cross_validation.csv")
          fig, ax = plt.subplots(figsize=(10, 6))
          means = [cv.loc[cv.model == k, "roc_auc_mean"].iloc[0] * 100 for k in keys]
          stds = [cv.loc[cv.model == k, "roc_auc_std"].iloc[0] * 100 for k in keys]
          ax.bar(labels, means, yerr=stds, capsize=5)
          ax.set_ylabel("Mean ROC AUC (%)")
          ax.set_ylim(0, 100)
          ax.set_title("Mean ROC AUC and Standard Deviation Across Five Fold Cross Validation")
          ax.tick_params(axis="x", rotation=20)
          fig.tight_layout()
          fig.savefig(output / "research_final_cv_roc_auc.png", dpi=300)
          plt.close(fig)

          fig, ax = plt.subplots(figsize=(9, 7))
          for label, key in zip(labels, keys):
              fpr, tpr, _ = roc_curve(y_test, probabilities[key], pos_label="Yes")
              auc = roc_auc_score(y_test, probabilities[key])
              ax.plot(fpr, tpr, label=f"{label} (AUC = {auc:.3f})")
          ax.plot([0, 1], [0, 1], linestyle="--", label="Chance")
          ax.set_xlabel("False Positive Rate")
          ax.set_ylabel("True Positive Rate")
          ax.set_title("ROC Curves on the Holdout Test Set")
          ax.legend(loc="lower right")
          fig.tight_layout()
          fig.savefig(output / "research_final_roc_curves.png", dpi=300)
          plt.close(fig)
          PY

      - name: Commit final research figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/figures/research_final_holdout_metrics.png reports/figures/research_final_confusion_matrix.png reports/figures/research_final_cv_roc_auc.png reports/figures/research_final_roc_curves.png
          git rm .github/workflows/research-figures.yml
          git commit -m "Store figures from reproducible final research run"
          git push origin HEAD:research-revision/reproducible-mutual-information
