name: Tests

"on":
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download release model
        run: |
          mkdir -p models
          curl -L \
            -o models/model.joblib \
            https://github.com/ernest-edem/customer-churn-ml/releases/download/v1.0.0/model.joblib

      - name: Verify model artifact
        run: |
          test -s models/model.joblib
          ls -lh models/model.joblib

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install project
        run: python -m pip install -e .

      - name: Run tests
        run: python -m pytest -q
