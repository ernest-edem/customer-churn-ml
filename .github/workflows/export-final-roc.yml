name: Export Final ROC Figure

"on":
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-revision/reproducible-mutual-information
      - uses: actions/upload-artifact@v4
        with:
          name: final-roc-figure
          path: reports/figures/research_final_roc_curves.png
