name: Docker Build

"on":
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create model directory
        run: mkdir -p models

      - name: Download release model
        run: |
          curl -L \
            -o models/model.joblib \
            https://github.com/ernest-edem/customer-churn-ml/releases/download/v1.0.0/model.joblib

      - name: Verify model artifact
        run: |
          test -s models/model.joblib
          ls -lh models/model.joblib

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: customer-churn-ml:ci
