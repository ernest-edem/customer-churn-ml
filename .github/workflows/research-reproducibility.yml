name: Final Research Artifact Generation

"on":
  push:
    branches:
      - research-revision/reproducible-mutual-information

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run final benchmark and create artifacts
        run: |
          python -m ml_system.benchmark
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          import sklearn

          from ml_system.benchmark import MODEL_CONFIGURATIONS
          from ml_system.config.loader import load_settings
          from ml_system.data import load_dataset, split_dataset
          from ml_system.evaluation import evaluate_model
          from ml_system.models import build_model
          from ml_system.pipeline import run_training_pipeline
          from ml_system.training import build_training_pipeline, train_model

          settings = load_settings("config/config.yaml")
          benchmark = pd.read_csv("reports/metrics/model_benchmark.csv")
          cross_validation = pd.read_csv("reports/metrics/cross_validation.csv")

          dataframe = load_dataset(settings.data.path)
          X_train, X_test, y_train, y_test = split_dataset(
              dataframe=dataframe,
              target_column=settings.data.target_column,
              settings=settings.split,
          )

          training_data = X_train.copy()
          training_data[settings.data.target_column] = y_train
          test_data = X_test.copy()
          test_data[settings.data.target_column] = y_test

          final_model = build_model(settings.model)
          pipeline = build_training_pipeline(
              dataframe=training_data,
              target_column=settings.data.target_column,
              preprocessing_settings=settings.preprocessing,
              feature_selection_settings=settings.features.selection,
              model=final_model,
          )
          trained = train_model(
              pipeline=pipeline,
              training_data=training_data,
              target_column=settings.data.target_column,
          )
          final_metrics = evaluate_model(
              pipeline=trained,
              test_data=test_data,
              target_column=settings.data.target_column,
              metrics=settings.evaluation.metrics,
          )

          selector = trained.named_steps["feature_selection"]
          preprocessor = trained.named_steps["preprocessing"]
          names = preprocessor.get_feature_names_out()
          selected = pd.DataFrame({
              "feature": names[selector.get_support()],
              "mutual_information": selector.scores_[selector.get_support()],
          }).sort_values("mutual_information", ascending=False)
          selected.to_csv(
              "reports/metrics/mutual_information_top10.csv",
              index=False,
          )

          final_run = {
              "software": {
                  "python": "3.11",
                  "scikit_learn": sklearn.__version__,
              },
              "dataset": {
                  "processed_records": int(len(dataframe)),
                  "training_records": int(len(X_train)),
                  "holdout_records": int(len(X_test)),
              },
              "configuration": {
                  "split_random_state": settings.split.random_state,
                  "feature_selection": settings.features.selection.method,
                  "feature_selection_top_k": settings.features.selection.top_k,
                  "feature_selection_random_state": settings.features.selection.random_state,
                  "model": settings.model.name,
                  "model_parameters": settings.model.parameters,
              },
              "holdout_benchmark": benchmark.to_dict(orient="records"),
              "cross_validation": cross_validation.to_dict(orient="records"),
              "final_model_metrics": final_metrics,
              "selected_features": selected.to_dict(orient="records"),
          }

          Path("reports/metrics/research_final_run.json").write_text(
              json.dumps(final_run, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Commit final research artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f models/model.joblib reports/metrics/production_metrics.json reports/metrics/model_benchmark.csv reports/metrics/cross_validation.csv reports/metrics/mutual_information_top10.csv reports/metrics/research_final_run.json
          git rm .github/workflows/research-reproducibility.yml
          git commit -m "Store reproducible final research artifacts"
          git push origin HEAD:research-revision/reproducible-mutual-information
