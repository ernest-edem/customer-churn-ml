name: Research Reproducibility Run

"on":
  push:
    branches:
      - research-revision/reproducible-mutual-information

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run reproducible benchmark
        run: |
          python -m ml_system.benchmark

      - name: Print final benchmark outputs
        run: |
          echo "=== HOLDOUT BENCHMARK ==="
          cat reports/metrics/model_benchmark.csv
          echo ""
          echo "=== FIVE FOLD CROSS VALIDATION ==="
          cat reports/metrics/cross_validation.csv

      - name: Print detailed final run diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          from ml_system.benchmark import MODEL_CONFIGURATIONS
          from ml_system.config.loader import load_settings
          from ml_system.data import load_dataset, split_dataset
          from ml_system.evaluation import evaluate_model
          from ml_system.models import build_model
          from ml_system.training import build_training_pipeline, train_model

          settings = load_settings("config/config.yaml")
          dataframe = load_dataset(settings.data.path)
          X_train, X_test, y_train, y_test = split_dataset(
              dataframe=dataframe,
              target_column=settings.data.target_column,
              settings=settings.split,
          )

          training_data = X_train.copy()
          training_data[settings.data.target_column] = y_train
          test_data = X_test.copy()
          test_data[settings.data.target_column] = y_test

          for model_settings in MODEL_CONFIGURATIONS:
              print(f"=== {model_settings.name.upper()} ===")
              model = build_model(model_settings)
              pipeline = build_training_pipeline(
                  dataframe=training_data,
                  target_column=settings.data.target_column,
                  preprocessing_settings=settings.preprocessing,
                  feature_selection_settings=settings.features.selection,
                  model=model,
              )
              trained = train_model(
                  pipeline=pipeline,
                  training_data=training_data,
                  target_column=settings.data.target_column,
              )
              metrics = evaluate_model(
                  pipeline=trained,
                  test_data=test_data,
                  target_column=settings.data.target_column,
                  metrics=settings.evaluation.metrics,
              )

              print("confusion_matrix:", metrics["confusion_matrix"])
              print("classification_report:")
              print(metrics["classification_report"])

              selector = trained.named_steps.get("feature_selection")
              preprocessor = trained.named_steps["preprocessing"]
              if selector is not None:
                  names = preprocessor.get_feature_names_out()
                  selected = pd.DataFrame({
                      "feature": names[selector.get_support()],
                      "mutual_information": selector.scores_[selector.get_support()],
                  }).sort_values(
                      "mutual_information",
                      ascending=False,
                  )
                  print("selected_features:")
                  print(selected.to_string(index=False))
          PY
