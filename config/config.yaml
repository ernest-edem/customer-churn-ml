project:
  name: customer_churn_ml
  version: "1.0"

data:
  path: data/processed/customer_churn_processed.csv
  target_column: Churn

task:
  type: classification

split:
  test_size: 0.20
  random_state: 42
  stratify: true

preprocessing:
  missing_values:
    strategy: median

  categorical_encoding:
    strategy: onehot

  numerical_scaling:
    strategy: standard

features:
  selection:
    enabled: true
    method: mutual_information
    top_k: 10

model:
  name: gradient_boosting
  parameters:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 3
    random_state: 42

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - roc_auc

persistence:
  model_path: models/model.joblib